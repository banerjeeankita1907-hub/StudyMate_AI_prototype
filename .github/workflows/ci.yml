name: StudyMate CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server and proxy syntax
        run: npm run check
      - name: Run server, API and browser integrity tests
        run: npm test
